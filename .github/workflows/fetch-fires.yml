# .github/workflows/fetch-fires.yml
name: Fetch fires

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run fetch-fires
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}